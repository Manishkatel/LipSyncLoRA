job: extension
config:
  name: lip_sync_lora
  process:
  - type: diffusion_trainer
    training_folder: /app/ai-toolkit/output
    sqlite_db_path: /app/ai-toolkit/aitk_db.db
    device: cuda
    trigger_word: null
    performance_log_every: 10
    network:
      type: lora
      linear: 32
      linear_alpha: 32
      conv: 16
      conv_alpha: 16
      lokr_full_rank: true
      lokr_factor: -1
      network_kwargs:
        ignore_if_contains: []
    save:
      dtype: bf16
      save_every: 250
      max_step_saves_to_keep: 4
      save_format: diffusers
      push_to_hub: false
    datasets:
    - folder_path: /app/ai-toolkit/datasets/lip_sync
      mask_path: null
      mask_min_value: 0.1
      default_caption: ''
      caption_ext: txt
      caption_dropout_rate: 0.05
      cache_latents_to_disk: true
      is_reg: false
      network_weight: 1
      resolution:
      - 512
      controls: []
      shrink_video_to_frames: true
      num_frames: 81
      flip_x: false
      flip_y: false
      num_repeats: 1
      fps: 16
      do_audio: true
    train:
      batch_size: 1
      bypass_guidance_embedding: false
      steps: 3000
      gradient_accumulation: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      timestep_type: sigmoid
      content_or_style: balanced
      optimizer_params:
        weight_decay: 0.0001
      unload_text_encoder: false
      cache_text_embeddings: false
      lr: 0.0001
      ema_config:
        use_ema: false
        ema_decay: 0.99
      skip_first_sample: false
      force_first_sample: false
      disable_sampling: false
      dtype: bf16
      diff_output_preservation: false
      diff_output_preservation_multiplier: 1
      diff_output_preservation_class: person
      switch_boundary_every: 1
      loss_type: mse
    logging:
      log_every: 1
      use_ui_logger: true
    model:
      name_or_path: Lightricks/LTX-2.3/ltx-2.3-22b-dev.safetensors
      quantize: true
      qtype: qfloat8
      quantize_te: true
      qtype_te: qfloat8
      arch: ltx2.3
      low_vram: false
      model_kwargs: {}
      compile: false
    sample:
      sampler: flowmatch
      sample_every: 250
      sample_start_step: 0
      width: 853
      height: 480
      samples:
      - prompt: Manish says "I am doing my assignment today."
      - prompt: Manish says "I am tired right now."
      - prompt: Manish says "Training LoRA is hard."
      neg: ''
      seed: 42
      walk_seed: true
      guidance_scale: 4
      sample_steps: 30
      num_frames: 81
      fps: 16
meta:
  name: lip_sync_lora
  version: '1.0'
